<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMCH Management Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0px; padding: 0px; font-family: SolaimanLipi, Kalpurush, Arial, sans-serif; }

        body { background-color: rgb(244, 247, 246); color: rgb(51, 51, 51); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .dashboard-card { background: rgb(255, 255, 255); padding: 35px 20px; border-radius: 12px; box-shadow: rgba(0, 0, 0, 0.08) 0px 8px 24px; width: 100%; max-width: 480px; text-align: center; }

        h1 { font-size: 22px; color: rgb(26, 37, 47); margin-bottom: 8px; }

        p.subtitle { font-size: 14px; color: rgb(102, 102, 102); margin-bottom: 25px; }

        .button-grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }

        .dash-btn { 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            gap: 12px; 
            padding: 16px 14px; 
            border-radius: 8px; 
            text-decoration: none; 
            color: rgb(255, 255, 255); 
            font-size: 15px; 
            font-weight: bold; 
            transition: 0.3s; 
            box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 6px; 
            white-space: nowrap;
        }

        .dash-btn:hover { transform: translateY(-2px); box-shadow: rgba(0, 0, 0, 0.15) 0px 6px 12px; }

        .btn-overtime { background: linear-gradient(135deg, rgb(0, 140, 186), rgb(0, 95, 115)); }

        .btn-salary { background: linear-gradient(135deg, rgb(46, 125, 50), rgb(27, 94, 32)); }

        .btn-age { background: linear-gradient(135deg, #7c3aed, #4f46e5); }

        .icon { font-size: 20px; background: rgba(255, 255, 255, 0.2); padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex-shrink: 0; }

        .author-box { background-color: rgb(240, 247, 255); border: 1px dashed rgb(0, 140, 186); border-radius: 8px; padding: 15px; font-size: 13.5px; color: rgb(26, 37, 47); line-height: 1.6; }

        .author-box strong { color: rgb(0, 95, 115); }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>রাজশাহী মেডিকেল কলেজ হাসপাতাল</h1>
        <p class="subtitle">ড্রাইভার সেকশন ম্যানেজমেন্ট ড্যাশবোর্ড</p>

        <div class="button-grid">
            <!-- ওভারটাইম বিল অপশন -->
            <a href="https://manik-rmch.github.io/overtime-bill/" class="dash-btn btn-overtime">
                <span class="icon">📝</span>
                <span>ওভারটাইম বিল তৈরি</span>
            </a>

            <!-- স্যালারি ক্যালকুলেশন অপশন -->
            <a href="https://manik-rmch.github.io/salary-calculator/" class="dash-btn btn-salary">
                <span class="icon">💰</span>
                <span>স্যালারি ক্যালকুলেটর</span>
            </a>

            <!-- বয়স ও ডেট-টাইম ক্যালকুলেটর অপশন -->
            <a href="https://manik-rmch.github.io/age-calculator/" class="dash-btn btn-age">
                <span class="icon">📅</span>
                <span>বয়স ও ডেট-টাইম ক্যালকুলেটর</span>
            </a>
        </div>

        <!-- প্রস্তুতকারক তথ্য -->
        <div class="author-box">
            <strong>প্রস্তুতকারক:</strong> মোঃ মানিক<br>
            গাড়ি চালক, রাজশাহী মেডিকেল কলেজ হাসপাতাল, রাজশাহী।<br>
            <strong>মোবাইল:</strong> ০১৭২৯-৮১৫২৯১
        </div>
    </div>

</body>
</html>
