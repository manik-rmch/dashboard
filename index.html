<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMCH Management Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', 'Kalpurush', Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            color: #1a252f;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .dash-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            padding: 16px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .dash-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .btn-overtime {
            background: linear-gradient(135deg, #008CBA, #005f73);
        }

        .btn-salary {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
        }

        .icon {
            font-size: 22px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        /* প্রস্তুতকারক সেকশন ডিজাইন */
        .author-box {
            background-color: #f0f7ff;
            border: 1px dashed #008CBA;
            border-radius: 8px;
            padding: 15px;
            font-size: 13.5px;
            color: #1a252f;
            line-height: 1.6;
        }

        .author-box strong {
            color: #005f73;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>রাজশাহী মেডিকেল কলেজ হাসপাতাল</h1>
        <p class="subtitle">ড্রাইভার সেকশন ম্যানেজমেন্ট ড্যাশবোর্ড</p>

        <div class="button-grid">
            <!-- ওভারটাইম বিল অপশন -->
            <a href="https://manik-rmch.github.io/overtime-bill/" class="dash-btn btn-overtime">
                <span class="icon">📝</span>
                <span>ওভারটাইম বিল তৈরি</span>
            </a>

            <!-- স্যালারি ক্যালকুলেশন অপশন -->
            <a href="https://manik-rmch.github.io/salary-calculator/" class="dash-btn btn-salary">
                <span class="icon">💰</span>
                <span>স্যালারি ক্যালকুলেটর</span>
            </a>
        </div>

        <!-- প্রস্তুতকারক তথ্য -->
        <div class="author-box">
            <strong>প্রস্তুতকারক:</strong> মোঃ মানিক<br>
            গাড়ি চালক, রাজশাহী মেডিকেল কলেজ হাসপাতাল, রাজশাহী।<br>
            <strong>মোবাইল:</strong> ০১৭২৯-৮১৫২৯১
        </div>
    </div>

</body>
</html>
